[package]
name = "comodel-core"
version = "0.1.0"
edition = "2024"
description = "Núcleo de CoModel: adaptadores de proveedores, memoria compartida y relevo automático"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
async-trait = "0.1"
thiserror = "2"
base64 = "0.22"

[lints.rust]
unsafe_code = "forbid"
